[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd backend && npm ci --include=dev"
]

[phases.build]
cmds = [
  "echo 'Starting build...'",
  "cd backend && npm run prisma:generate",
  "cd backend && npm run build"
]

[start]
cmd = "cd backend && npx prisma migrate resolve --applied 20260312000000_add_boxset_fields_to_physical_copy || true && npx prisma migrate deploy && npx tsx prisma/migrations/seed-verified-status.ts && npm start"
